name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build (iOS, Xcode 27)
    # GitHub 官方 Xcode 27 专用镜像（macOS 27 + Xcode 27 工具链，arm64）
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      - name: Build (Simulator, 编译验证)
        run: |
          xcodebuild build \
            -project SubLingo.xcodeproj \
            -scheme SubLingo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-Sim \
            CODE_SIGNING_ALLOWED=NO

      # 真机 SDK Release 构建（无签名），用于产出 IPA 制品
      - name: Build (Device, unsigned)
        run: |
          xcodebuild build \
            -project SubLingo.xcodeproj \
            -scheme SubLingo \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 产物校验：防止 Info.plist 被 GENERATE_INFOPLIST_FILE 覆盖导致缺权限描述 / NSExtension
      - name: Verify app bundle (Info.plist sanity)
        run: |
          APP="build/DerivedData-Device/Build/Products/Release-iphoneos/SubLingo.app"
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Info.plist" > /dev/null
          plutil -extract NSSpeechRecognitionUsageDescription raw "$APP/Info.plist" > /dev/null
          plutil -extract NSLocationWhenInUseUsageDescription raw "$APP/Info.plist" > /dev/null
          plutil -extract NSSupportsLiveActivities raw "$APP/Info.plist" > /dev/null
          plutil -extract UIBackgroundModes.0 raw "$APP/Info.plist" > /dev/null
          plutil -extract UIApplicationSceneManifest.UIApplicationSupportsMultipleScenes raw "$APP/Info.plist" > /dev/null
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APP/PlugIns/SubLingoWidget.appex/Info.plist" > /dev/null
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APP/PlugIns/SubLingoBroadcast.appex/Info.plist" > /dev/null
          echo "Info.plist sanity check passed"

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData-Device/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry SubLingo-unsigned.ipa Payload
          ls -lh SubLingo-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: SubLingo-unsigned-ipa
          path: build/SubLingo-unsigned.ipa
          if-no-files-found: error
name: LiveSubtitleTranslator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_COMPILATION_MODE: wholemodule
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  LiveSubtitleTranslator:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livesubtitletranslator
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: LiveSubtitleWidget
        embed: true
      - target: LiveSubtitleBroadcast
        embed: true
  LiveSubtitleWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared/LiveCaptionAttributes.swift
    info:
      path: Widget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livesubtitletranslator.widget
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  LiveSubtitleBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
      - path: Sources/Shared/AudioStreamProtocol.swift
    info:
      path: Broadcast/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.livesubtitletranslator.broadcast
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  LiveSubtitleTranslator:
    build:
      targets:
        LiveSubtitleTranslator: all
    run:
      config: Debug
    archive:
      config: Release
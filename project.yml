name: SubLingo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_COMPILATION_MODE: wholemodule
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  SubLingo:
    type: application
    platform: iOS
    # 注意：不要使用 XcodeGen 的 info: 配置——它会在 generate 时重写手写 Info.plist，
    # 导致权限描述 / NSExtension 等键丢失。这里只用 INFOPLIST_FILE 引用仓库中的手写文件。
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sublingo
        INFOPLIST_FILE: Sources/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SubLingoWidget
        embed: true
      - target: SubLingoBroadcast
        embed: true
  SubLingoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
      - path: Sources/Shared/LiveCaptionAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sublingo.widget
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  SubLingoBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
        excludes:
          - "Info.plist"
      - path: Sources/Shared/AudioStreamProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sublingo.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
schemes:
  SubLingo:
    build:
      targets:
        SubLingo: all
    run:
      config: Debug
    archive:
      config: Release